name: "Prueba de fuentes (manual)"
# Solo manual. Prueba si GitHub puede leer fuentes públicas, gratis y sin clave, antes de integrarlas.
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  prueba:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Probar endpoints públicos
        run: |
          for u in \
            "https://api.chainbase.com/tops/v1/trending" \
            "https://api.chainbase.com/tops/v1/tool/list-trending-topics" \
            "https://api.coingecko.com/api/v3/search/trending" \
            "https://api.coinmarketcap.com/data-api/v3/topsearch/rank" \
            "https://www.reddit.com/r/CryptoCurrency/top/.rss?t=day&limit=5" \
            "https://wikimedia.org/api/rest_v1/metrics/pageviews/top/en.wikipedia/all-access/$(date -u -d '2 days ago' +%Y/%m/%d)" \
            "https://public.api.bsky.app/xrpc/app.bsky.unspecced.getTrendingTopics" \
            "https://r.jina.ai/https://pump.fun/leaderboard" \
            "https://r.jina.ai/https://fomo.family/leaderboard?range=30d" \
            "https://api.dexpaprika.com/networks" \
            "https://api.dexpaprika.com/networks/solana/pools/search?limit=100&created_after=-48h&order_by=volume_usd_24h&sort=desc" \
            "https://api.dexpaprika.com/networks/bsc/pools/search?limit=100&created_after=-48h&order_by=created_at&sort=desc" \
            "https://api.dexpaprika.com/networks/bsc/tokens/0x8436f5Fa0592c91ce8A856C604cC4f76A3223F5a" ; do
            echo "===== $u"
            code=$(curl -s -m 20 -A "desk-prueba/1.0 (solo lectura)" -o r.txt -w "%{http_code}" "$u" || echo ERR)
            echo "HTTP $code, $(wc -c < r.txt) bytes"
            head -c 2500 r.txt; echo
          done
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Radar de narrativas en seco (sin avisos ni guardado)
        run: |
          python3 scripts/narrativa.py
          python3 -c "
          import json; d=json.load(open('datos/narrativas.json'))
          print('fuentes', d['fuentes_ok'])
          for e in d['narrativas']: print(e['fuentes'], e['calor'], e['tema'][:60], '|', (e['token'] or {}).get('sym'), (e['token'] or {}).get('cadena'))
          print('huecos', [h['tema'] for h in d['huecos_h19']])"
