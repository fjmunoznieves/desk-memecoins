name: "Backtest H21 (manual)"
# Solo manual y solo lectura: cruza las entradas de nuestras billeteras con tokens que revivieron (Helius).
on:
  workflow_dispatch:
    inputs:
      limite:
        description: "Cuántos tokens probar"
        default: "20"
      grupo:
        description: "backtest (revivieron) o control (no revivieron)"
        default: "backtest"
      billeteras:
        description: "Archivo de billeteras (vacío = watchlist + top)"
        default: ""
      sufijo:
        description: "Sufijo para los archivos de salida"
        default: ""
      desde:
        description: "Desde qué token (0 = el primero)"
        default: "0"
permissions:
  contents: write
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q solders
      - name: Backtest
        env:
          HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
          LIMITE: ${{ inputs.limite }}
          DESDE: ${{ inputs.desde }}
          SALIDA: ${{ inputs.grupo }}${{ inputs.sufijo }}
          BILLETERAS: ${{ inputs.billeteras }}
          TOKENS: datos/h21_${{ inputs.grupo }}_tokens.tsv
        run: python3 -u scripts/h21_backtest.py
      - name: Guardar resultados
        run: |
          git config user.name "desk-bot"; git config user.email "desk-bot@users.noreply.github.com"
          git add datos/h21_*.tsv || true
          git commit -m "Backtest H21: resultados" || exit 0
          for i in 1 2 3 4; do git pull --rebase -q && git push -q && break; sleep $((i*5)); done
