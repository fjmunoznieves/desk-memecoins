name: "Análisis por token 1 año (manual)"
# Solo manual y solo lectura: primeros compradores de cada token (Helius) cruzados con las muestras A y B.
on:
  workflow_dispatch:
    inputs:
      max_pag:
        description: "Páginas de 100 transacciones por token"
        default: "10"
permissions:
  contents: write
jobs:
  anio:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: Análisis
        env:
          HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
          MAX_PAG: ${{ inputs.max_pag }}
        run: python3 -u scripts/tokens_anio.py
      - name: Guardar resultados
        if: always()
        run: |
          git config user.name "desk-bot"; git config user.email "desk-bot@users.noreply.github.com"
          git add datos/tokens_anio_resultado.tsv datos/tokens_anio_nuevas.tsv || true
          git commit -m "Análisis por token 1 año: resultados" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase -q && git push -q && break; sleep $((i*7)); done
