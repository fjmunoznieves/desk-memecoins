name: Telegram buscar contratos (solo lectura)
on:
  workflow_dispatch:
    inputs:
      canales: { default: "" }
      salida: { default: "datos/telegram/x2_menciones.tsv" }
jobs:
  buscar:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python scripts/telegram_buscar.py
        env: { TG_CANALES: "${{ github.event.inputs.canales }}", TG_OUT: "${{ github.event.inputs.salida }}" }
      - run: |
          git config user.name "desk-bot"; git config user.email "desk-bot@users.noreply.github.com"
          git add datos/telegram/x2_menciones*.tsv
          git diff --cached --quiet || git commit -m "Telegram x2 menciones $(date -u +%FT%H:%MZ)"
          for i in 1 2 3; do git pull --rebase -q origin main && git push -q origin HEAD:main && break; sleep 5; done
