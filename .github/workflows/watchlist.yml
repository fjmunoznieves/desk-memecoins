name: Watchlist Solana (Helius)
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}
permissions:
  contents: write
  issues: write
concurrency:
  group: watchlist
  cancel-in-progress: false
jobs:
  vigilar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compras nuevas de la watchlist (solo lectura)
        env:
          HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
        run: python3 scripts/watch_solana.py
      - name: Avisar si 2+ billeteras compran el mismo token
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/alerta_issue.py
      - name: Guardar resultados
        run: |
          git config user.name "desk-bot"
          git config user.email "desk-bot@users.noreply.github.com"
          git add datos/watchlist_estado.json datos/watchlist_compras.tsv 2>/dev/null || true
          git commit -m "Watchlist $(date -u +%Y-%m-%dT%H:%MZ)" || { echo "sin cambios"; exit 0; }
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
