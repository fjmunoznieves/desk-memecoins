name: Prueba seguridad BNB (manual)
on:
  workflow_dispatch:
    inputs:
      token:
        description: "contrato BNB"
        required: true
jobs:
  prueba:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: GoPlus crudo y revisión
        run: |
          curl -s "https://api.gopluslabs.io/api/v1/token_security/56?contract_addresses=${{ inputs.token }}" | python3 -c "
          import json,sys
          r=list(json.load(sys.stdin)['result'].values())[0]
          print({k:v for k,v in r.items() if k not in ('holders','lp_holders','dex')})"
          python3 scripts/seguridad.py bsc ${{ inputs.token }}
