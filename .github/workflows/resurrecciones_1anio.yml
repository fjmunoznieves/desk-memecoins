name: "Resurrecciones 1 año (manual)"
# Solo manual y solo lectura: detecta resurrecciones en 365 días de velas (DexPaprika) del universo Solana.
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  detectar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: python3 -u scripts/resurrecciones_1anio.py
      - name: Guardar
        if: always()
        run: |
          git config user.name "desk-bot"; git config user.email "desk-bot@users.noreply.github.com"
          git add datos/resurrecciones_1anio.json || true
          git commit -m "Resurrecciones 1 año: eventos" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase -q && git push -q && break; sleep $((i*7)); done
