name: Velas de respaldo de la escucha (papel)
# 25-nov (Fran OK "1 y 2 gratis"): al terminar cada escucha baja velas de 1 min de GeckoTerminal (gratis, sin clave)
# de los tokens que compraron las A, por si el websocket estuvo caído. Lo dispara el paso Relevo de escucha_A.yml.
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: velas-escucha
  cancel-in-progress: false
jobs:
  velas:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python scripts/velas_escucha.py
      - name: Guardar
        if: always()
        run: |
          git config user.name "desk-bot"
          git config user.email "desk-bot@users.noreply.github.com"
          git add datos/escucha/velas_*.tsv || true
          git commit -m "Velas escucha $(date -u +%Y-%m-%dT%H:%MZ)" || { echo "sin cambios"; exit 0; }
          for i in 1 2 3 4; do git pull --rebase && git push && break; sleep 7; done
