name: H16 historial de tokens nuevos (diario)
on:
  schedule:
    - cron: "23 6 * * *"   # 1:23 AM Bogotá: solo tokens nuevos o pendientes
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: h16
  cancel-in-progress: false
jobs:
  muertos:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Velas diarias y marca de muertos (GeckoTerminal, solo lectura)
        run: python3 scripts/muertos.py
      - name: Guardar
        run: |
          git config user.name "desk-bot"
          git config user.email "desk-bot@users.noreply.github.com"
          git add datos/muertos.json
          git commit -m "H16 muertos $(date -u +%Y-%m-%d)" || { echo "sin cambios"; exit 0; }
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
