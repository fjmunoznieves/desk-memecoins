name: Revisar billeteras (Etherscan)
on:
  workflow_dispatch: {}
  schedule:
    - cron: "17 12 */2 * *"   # 7:17 AM Bogotá, cada 2 días
permissions:
  contents: write
concurrency:
  group: escaneo
  cancel-in-progress: false
jobs:
  billeteras:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Consultar Etherscan v2 (solo lectura)
        env:
          ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
        run: python3 scripts/billeteras.py
      - name: Guardar resultados
        run: |
          git config user.name "desk-bot"
          git config user.email "desk-bot@users.noreply.github.com"
          git add datos/billeteras_etherscan.tsv
          git commit -m "Billeteras $(date -u +%Y-%m-%dT%H:%MZ)" || echo "sin cambios"
          git pull --rebase && git push
