name: Escucha A en segundos (papel)
# 21-nov (Fran OK "Sí, activar en papel"): websocket público de Solana, gratis, sin clave, no gasta Helius.
# Solo lectura: registra compras/ventas A y el precio posterior del token en datos/escucha/.
on:
  schedule:
    - cron: "0 0,6,12,18 * * *"   # 4 corridas de ~5,7 h: escucha casi continua (repo público, minutos sin costo)
  workflow_dispatch:
    inputs:
      minutos:
        description: "Minutos de escucha (máx ~340)"
        default: "340"
      debug:
        description: "Imprimir N notificaciones crudas"
        default: "0"
permissions:
  contents: write
  actions: write   # 25-nov: el guardián (scripts/guardian.py) corre dentro de la escucha cada 15 min
concurrency:
  group: escucha
  cancel-in-progress: false
jobs:
  escuchar:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install websockets==12.0
      - name: Escuchar
        env:
          ESCUCHA_MINUTOS: ${{ github.event.inputs.minutos || '340' }}
          ESCUCHA_DEBUG: ${{ github.event.inputs.debug || '0' }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 22-nov (Fran: observatorio liviano): la escucha programada termina el 27-nov; a mano sigue funcionando.
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$(date -u +%Y%m%d)" -gt 20261211 ]; then echo "escucha terminada (11-dic, extendida 24-nov por Fran)"; exit 0; fi
          python scripts/escucha_A.py
      - name: Guardar
        if: always()
        run: |
          git config user.name "desk-bot"
          git config user.email "desk-bot@users.noreply.github.com"
          git add datos/escucha || true
          git commit -m "Escucha A $(date -u +%Y-%m-%dT%H:%MZ)" || { echo "sin cambios"; exit 0; }
          for i in 1 2 3 4; do git pull --rebase && git push && break; sleep 7; done
      - name: Relevo (25-nov)
        # 25-nov: GitHub dejó caer las corridas de 06 y 12 UTC (sin escucha de 07:33 a 15:00 UTC; se perdió Pompom).
        # Al terminar, la escucha dispara la siguiente; la concurrencia "escucha" evita duplicadas.
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "$(date -u +%Y%m%d)" -gt 20261211 ]; then echo "fin de la escucha, sin relevo"; exit 0; fi
          curl -s -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/escucha_A.yml/dispatches" -d '{"ref":"main"}' && echo "relevo disparado"
          curl -s -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/velas_escucha.yml/dispatches" -d '{"ref":"main"}' && echo "velas de respaldo disparadas"
