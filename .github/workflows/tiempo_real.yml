name: Tiempo real (Worker Cloudflare + webhook Helius)
# 19-nov (Fran): vigilancia en tiempo real de las billeteras de H34. Manual. Solo lectura de la cadena, paper.
on:
  workflow_dispatch:
    inputs:
      webhook:
        description: "Crear/actualizar el webhook de Helius (100 créditos)"
        default: "si"
permissions:
  contents: write
jobs:
  desplegar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Clave del webhook (derivada, nunca se imprime)
        run: |
          A=$(printf '%s' "${CLOUDFLARE_API_TOKEN}desk-h34" | sha256sum | cut -c1-48)
          echo "::add-mask::$A"
          echo "WEBHOOK_AUTH=$A" >> "$GITHUB_ENV"
      - name: Espacio KV
        run: |
          API="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}"
          ID=$(curl -s -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "$API/storage/kv/namespaces?per_page=100" | python3 -c "import json,sys;d=json.load(sys.stdin);print(next((n['id'] for n in d.get('result') or [] if n['title']=='desk-h34'),''))")
          if [ -z "$ID" ]; then
            ID=$(curl -s -X POST -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H "Content-Type: application/json" -d '{"title":"desk-h34"}' "$API/storage/kv/namespaces" | python3 -c "import json,sys;d=json.load(sys.stdin);print((d.get('result') or {}).get('id','') or (print(d.get('errors'),file=sys.stderr) or ''))")
          fi
          [ -n "$ID" ] || { echo "no se pudo crear el KV (¿el token tiene permiso Workers KV Storage?)"; exit 1; }
          printf '\n[[kv_namespaces]]\nbinding = "H34"\nid = "%s"\n' "$ID" >> tiempo_real/wrangler.toml
      - name: Base de datos D1
        run: |
          API="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database"
          H="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
          ID=$(curl -s -H "$H" "$API?name=desk-h34" | python3 -c "import json,sys;d=json.load(sys.stdin);print(next((x['uuid'] for x in d.get('result') or [] if x['name']=='desk-h34'),''))")
          if [ -z "$ID" ]; then
            ID=$(curl -s -X POST -H "$H" -H "Content-Type: application/json" -d '{"name":"desk-h34"}' "$API" | python3 -c "import json,sys;d=json.load(sys.stdin);print((d.get('result') or {}).get('uuid','')) if d.get('success') else print('',file=sys.stderr) or print(d.get('errors'),file=sys.stderr)")
          fi
          [ -n "$ID" ] || { echo "no se pudo crear D1 (¿el token tiene permiso D1 Edit?)"; exit 1; }
          python3 -c "import json;print(json.dumps({'sql':open('tiempo_real/esquema.sql').read()}))" > /tmp/q.json
          curl -s -X POST -H "$H" -H "Content-Type: application/json" --data @/tmp/q.json "$API/$ID/query" | python3 -c "import json,sys;d=json.load(sys.stdin);print('esquema D1:', 'ok' if d.get('success') else d.get('errors'))"
          for q in "ALTER TABLE det ADD COLUMN intentos INTEGER DEFAULT 0" "ALTER TABLE det ADD COLUMN ts_precio INTEGER"; do
            python3 -c "import json,sys;print(json.dumps({'sql':sys.argv[1]}))" "$q" > /tmp/q.json
            curl -s -X POST -H "$H" -H "Content-Type: application/json" --data @/tmp/q.json "$API/$ID/query" | python3 -c "import json,sys;d=json.load(sys.stdin);print('alter:', 'ok' if d.get('success') else 'ya existía')"
          done
          printf '\n[[d1_databases]]\nbinding = "DB"\ndatabase_name = "desk-h34"\ndatabase_id = "%s"\n' "$ID" >> tiempo_real/wrangler.toml
      - name: Subdominio workers.dev
        run: |
          API="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/subdomain"
          S=$(curl -s -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "$API" | python3 -c "import json,sys;d=json.load(sys.stdin);print((d.get('result') or {}).get('subdomain') or '')")
          if [ -z "$S" ]; then
            S="desk-$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | sha256sum | cut -c1-8)"
            curl -s -X PUT -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H "Content-Type: application/json" -d "{\"subdomain\":\"$S\"}" "$API" > /dev/null
          fi
          echo "WEBHOOK_URL=https://desk-h34.$S.workers.dev/webhook" >> "$GITHUB_ENV"
          echo "https://desk-h34.$S.workers.dev" > datos/rt_url.txt
      - name: Publicar Worker
        working-directory: tiempo_real
        run: |
          npx --yes wrangler@3.114.0 deploy
          printf '%s' "$WEBHOOK_AUTH" | npx --yes wrangler@3.114.0 secret put WEBHOOK_AUTH
      - name: Webhook Alchemy (227 A)
        env:
          ALCHEMY_NOTIFY_TOKEN: ${{ secrets.ALCHEMY_NOTIFY_TOKEN }}
        run: |
          if [ -z "$ALCHEMY_NOTIFY_TOKEN" ]; then echo "sin ALCHEMY_NOTIFY_TOKEN: se omite Alchemy"; exit 0; fi
          WEBHOOK_URL="${WEBHOOK_URL%/webhook}/alchemy" SALIDA=/tmp/ak python3 scripts/alchemy_webhook.py
          echo "::add-mask::$(cat /tmp/ak)"
          [ -s /tmp/ak ] || { echo "webhook Alchemy ya existía; se conserva su firma"; exit 0; }
          cd tiempo_real && cat /tmp/ak | npx --yes wrangler@3.114.0 secret put ALCHEMY_SIGNING_KEY && rm -f /tmp/ak
      - name: Probar Worker
        run: |
          sleep 15
          U=$(cat datos/rt_url.txt)
          echo "GET /eventos: $(curl -s -m 20 "$U/eventos" | head -c 200)"
          echo "POST sin clave (debe dar 401): $(curl -s -o /dev/null -w '%{http_code}' -m 20 -X POST -H 'Content-Type: application/json' -d '[]' "$U/webhook")"
          echo "POST /alchemy sin firma (debe dar 401): $(curl -s -o /dev/null -w '%{http_code}' -m 20 -X POST -d '{}' "$U/alchemy")"
          echo "POST con clave (debe dar 200): $(curl -s -o /dev/null -w '%{http_code}' -m 20 -X POST -H 'Content-Type: application/json' -H "Authorization: $WEBHOOK_AUTH" -d '[]' "$U/webhook")"
      - name: Webhook Helius
        if: ${{ inputs.webhook == 'si' }}
        env:
          HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
        run: python3 scripts/helius_webhook.py
      - name: Guardar URL
        run: |
          git config user.name "desk-bot"; git config user.email "desk-bot@users.noreply.github.com"
          git checkout -- tiempo_real/wrangler.toml tiempo_real/billeteras.js 2>/dev/null || true
          git add datos/rt_url.txt
          git commit -m "Tiempo real: URL del Worker" || true
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
