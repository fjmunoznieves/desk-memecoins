name: Escaneo desk (paper)
on:
  schedule:
    - cron: "47 8 * * *"    # 3:47 AM Bogotá
    - cron: "7 14 * * *"    # 9:07 AM Bogotá
    - cron: "27 17 * * *"   # 12:27 PM Bogotá (opcional: se salta si el gasto va por encima del ritmo)
    - cron: "47 20 * * *"   # 3:47 PM Bogotá
  workflow_dispatch: {}
permissions:
  contents: write
  actions: read
  issues: write
concurrency:
  group: h16
  cancel-in-progress: false
jobs:
  escaneo:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SOMBRA_OUT: datos/estudio_reglas_sombra.tsv
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Freno mensual (tope 1.000 min)
        id: freno
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/presupuesto.py "${{ (github.event.schedule == '27 17 * * *') && 'escaneo_opcional' || 'escaneo' }}"
      - name: Escanear (GeckoTerminal + DexScreener)
        if: steps.freno.outputs.corre == 'true'
        run: python3 scripts/scan.py
      - name: H16 sumar tokens de más de 7 días al universo
        if: steps.freno.outputs.corre == 'true'
        run: python3 scripts/universo_agregar.py rows.json
      - name: Chequeo de que GoPlus responde (BNB)
        if: steps.freno.outputs.corre == 'true'
        continue-on-error: true
        run: python3 scripts/seguridad.py bsc 0x8436f5Fa0592c91ce8A856C604cC4f76A3223F5a
      - name: Filtros numéricos
        if: steps.freno.outputs.corre == 'true'
        run: python3 scripts/filtro.py
      - name: Informe con revisión de seguridad
        if: steps.freno.outputs.corre == 'true'
        run: python3 scripts/reporte.py
      - name: Sombra (registrar y medir a 24 h)
        if: steps.freno.outputs.corre == 'true'
        run: |
          python3 scripts/sombra.py registrar rows2.json
          python3 scripts/sombra.py medir
          python3 scripts/sombra.py resumen > datos/sombra_resumen.txt || true
      - name: Watchlist Solana, compras nuevas (Helius, solo lectura)
        continue-on-error: true
        env:
          HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
        run: python3 scripts/watch_solana.py
      - name: Aviso si 2+ billeteras compran el mismo token
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/alerta_issue.py
      - name: H16 resurrecciones (DexScreener, solo lectura)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/resurreccion.py
      - name: Radar de narrativas H17-H19 (solo 3:47 y 9:07; nunca tumba la corrida)
        if: steps.freno.outputs.corre == 'true' && (github.event.schedule == '47 8 * * *' || github.event.schedule == '7 14 * * *' || github.event_name == 'workflow_dispatch')
        continue-on-error: true
        timeout-minutes: 3
        env:
          GH_TOKEN: ${{ github.token }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
        run: python3 scripts/narrativa.py
      - name: Billeteras BNB/Robinhood (solo en el de 3:47 AM)
        if: github.event.schedule == '47 8 * * *'
        continue-on-error: true
        env:
          ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
        run: python3 scripts/billeteras.py
      - name: Guardar resultados
        if: always()
        run: |
          git config user.name "desk-bot"
          git config user.email "desk-bot@users.noreply.github.com"
          git add escaneos datos
          git commit -m "Escaneo $(date -u +%Y-%m-%dT%H:%MZ)" || echo "sin cambios"
          git pull --rebase && git push

