name: H16 resurrección (cada hora, sombra)
on:
  schedule:
    - cron: "37 * * * *"
  workflow_dispatch: {}
permissions:
  contents: write
  issues: write
concurrency:
  group: h16
  cancel-in-progress: false
jobs:
  vigilar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Volumen de la última hora de los muertos (DexScreener, solo lectura)
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/resurreccion.py
      - name: Guardar
        run: |
          git config user.name "desk-bot"
          git config user.email "desk-bot@users.noreply.github.com"
          git add datos/h16_resurrecciones.tsv
          git commit -m "H16 $(date -u +%Y-%m-%dT%H:%MZ)" || { echo "sin cambios"; exit 0; }
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
